name: ci

# 이 파일은 main의 워크플로다. v1 브랜치(fixed, vulnerable, k8s-netpol)는 각자 자기 브랜치의 워크플로 파일을 따른다.
# workflow_dispatch는 Actions 탭에서 수동으로 다시 돌리기 위한 것이다.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 기본 토큰 권한은 모두 끄고, 잡마다 필요한 만큼만 연다.
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 웹(Next.js): 빌드와 테스트.
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    # 이 잡의 명령은 모두 apps/web에서 실행한다.
    defaults:
      run:
        working-directory: apps/web
        # bash를 명시하면 pipefail이 켜진다. 테스트 출력을 tee로 받아도 테스트의 실패가 단계의 실패로 남는다.
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # 의존성 캐시는 쓰지 않는다(캐시 오염 경로를 없애는 대신 설치 시간이 늘어난다).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build
      - run: npm test 2>&1 | tee "$RUNNER_TEMP/test-output.txt"
      # 테스트가 실패해도 Summary는 쓴다. 건수와 실패한 테스트 이름만 옮긴다.
      - if: always()
        run: node ../../.github/scripts/test-summary.mjs "웹 테스트" "$RUNNER_TEMP/test-output.txt"

  # API(Nest.js): 러너 안의 PostgreSQL에 마이그레이션과 시드를 적용하고 HTTP 수준 테스트를 돌린다.
  api:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    services:
      postgres:
        # 로컬 compose.yaml과 같은 이미지·다이제스트다.
        image: postgres:18.7-alpine3.24@sha256:0115267ab5a509022df9319c77be365cef335adb71556c75f60f5360ee247e71
        env:
          POSTGRES_USER: enroll
          # 러너와 함께 사라지는 DB의 더미 값이다. 저장소 시크릿이 아니다.
          POSTGRES_PASSWORD: dummy-ci-only
          POSTGRES_DB: enroll
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U enroll -d enroll"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL: postgresql://enroll:dummy-ci-only@127.0.0.1:5432/enroll
      # 토큰 서명 키. 러너 안에서만 쓰는 더미 값이다. 저장소 시크릿이 아니다.
      TOKEN_SECRET: dummy-ci-only-token-secret-000000000
    defaults:
      run:
        working-directory: apps/api
        # bash를 명시하면 pipefail이 켜진다. 테스트 출력을 tee로 받아도 테스트의 실패가 단계의 실패로 남는다.
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # 의존성의 설치 스크립트는 실행하지 않는다. Prisma는 설치 스크립트 없이도 동작한다.
      - run: npm ci --ignore-scripts
      - run: npm run db:generate
      - run: npm run build
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm test 2>&1 | tee "$RUNNER_TEMP/test-output.txt"
      # 테스트가 실패해도 Summary는 쓴다. 건수와 실패한 테스트 이름만 옮긴다.
      - if: always()
        run: node ../../.github/scripts/test-summary.mjs "API 테스트" "$RUNNER_TEMP/test-output.txt"

  # 앱마다 lock 파일과 예외 목록이 따로 있다.
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: web
            exceptions: .github/audit-exceptions.json
          - app: api
            exceptions: .github/audit-exceptions.api.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # npm audit은 package-lock.json만 읽으므로 설치 없이 실행한다. 두 번째 인자는 lock 파일이 있는 앱 폴더다.
      # 매트릭스 값은 명령 문자열에 직접 끼워 넣지 않고 환경 변수로 넘긴다.
      - run: node .github/scripts/audit-gate.mjs "$EXCEPTIONS" "apps/$APP"
        env:
          EXCEPTIONS: ${{ matrix.exceptions }}
          APP: ${{ matrix.app }}

  # 네트워크 계층 검증. 러너 안에 kind 클러스터를 만들어 정책을 걸고 매트릭스를 돌린다.
  # 클러스터는 러너와 함께 사라진다. 레지스트리 푸시나 배포는 하지 않는다.
  netpol:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      # 내려받는 도구는 버전과 체크섬으로 고정한다. 체크섬은 각 릴리스가 공개한 값이다.
      KIND_VERSION: v0.33.0
      KIND_SHA256: aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d
      CILIUM_CLI_VERSION: v0.20.1
      CILIUM_CLI_SHA256: 24e817dcfcc8a12e325ce7547617bcbcf171c5b0b335bb24d2bb1207ba047f61
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: kind와 Cilium CLI 설치 (체크섬 확인)
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/bin"
          mkdir -p "$bin"
          curl -fsSL -o "$bin/kind" "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          echo "${KIND_SHA256}  $bin/kind" | sha256sum --check --strict
          chmod +x "$bin/kind"
          curl -fsSL -o "$RUNNER_TEMP/cilium.tar.gz" "https://github.com/cilium/cilium-cli/releases/download/${CILIUM_CLI_VERSION}/cilium-linux-amd64.tar.gz"
          echo "${CILIUM_CLI_SHA256}  $RUNNER_TEMP/cilium.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/cilium.tar.gz" -C "$bin" cilium
          # 러너에 미리 설치된 kind보다 고정한 버전이 먼저 잡히도록 경로 앞에 둔다.
          echo "$bin" >> "$GITHUB_PATH"
      # 이미지 빌드, 클러스터 생성, Cilium 설치, 앱·클라이언트 배포. 로컬과 같은 스크립트다.
      - run: ./k8s/up.sh
      # 결과 표는 Summary에 남는다. 한 줄이라도 기대와 다르면 실패한다.
      - run: node k8s/verify/run.mjs
      - name: 실패했을 때 클러스터 상태 출력
        if: failure()
        run: |
          kubectl --context kind-enroll-lab get pods -A -o wide || true
          kubectl --context kind-enroll-lab -n enroll describe pods || true
          cilium status || true
