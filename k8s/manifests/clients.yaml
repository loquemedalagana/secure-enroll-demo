# 요청을 보내는 쪽 세 개. 앱과 같은 이미지를 쓰고(Node의 fetch로 요청), 서버는 띄우지 않고 대기만 한다.
#   gateway   : 앱에 접근이 허용된 유일한 출발지
#   bystander : 같은 네임스페이스에 있지만 허용되지 않은 출발지
#   outsider  : 다른 네임스페이스의 출발지 (파일 끝)
apiVersion: v1
kind: Pod
metadata:
  name: gateway
  namespace: enroll
  labels:
    app.kubernetes.io/name: gateway
spec:
  automountServiceAccountToken: false
  terminationGracePeriodSeconds: 1
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: client
      image: secure-enroll-demo:kind
      imagePullPolicy: Never
      command: ["node", "-e", "setInterval(() => {}, 1 << 30)"]
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
---
apiVersion: v1
kind: Pod
metadata:
  name: bystander
  namespace: enroll
  labels:
    app.kubernetes.io/name: bystander
spec:
  automountServiceAccountToken: false
  terminationGracePeriodSeconds: 1
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: client
      image: secure-enroll-demo:kind
      imagePullPolicy: Never
      command: ["node", "-e", "setInterval(() => {}, 1 << 30)"]
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
---
# outsider: 다른 네임스페이스의 파드. 이 네임스페이스에는 정책이 없어 나가는 쪽은 열려 있다.
# 보내는 쪽이 제한되지 않아도 받는 쪽(앱)의 정책이 막는지 확인하기 위한 것이다.
apiVersion: v1
kind: Namespace
metadata:
  name: enroll-outside
---
apiVersion: v1
kind: Pod
metadata:
  name: outsider
  namespace: enroll-outside
  labels:
    app.kubernetes.io/name: outsider
spec:
  automountServiceAccountToken: false
  terminationGracePeriodSeconds: 1
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: client
      image: secure-enroll-demo:kind
      imagePullPolicy: Never
      command: ["node", "-e", "setInterval(() => {}, 1 << 30)"]
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
