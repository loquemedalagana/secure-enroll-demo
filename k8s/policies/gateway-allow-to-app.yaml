# gateway는 앱의 3000번으로만 나간다. 받는 쪽 허용만으로는 부족하다(보내는 쪽도 기본 거부이므로).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-allow-to-app
  namespace: enroll
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: gateway
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: enroll-app
      ports:
        - protocol: TCP
          port: 3000
